<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dubins Path Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #fff;
            height: 100vh;
            display: flex;
        }

        .canvas-area {
            flex: 1;
            position: relative;
            background: #0a0a0a;
            overflow: hidden;
        }

        .controls {
            width: 300px;
            background: #2a2a2a;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 24px;
            color: #00d4ff;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            color: #888;
        }

        .control-group {
            background: #333;
            padding: 15px;
            border-radius: 8px;
        }

        .control-group h3 {
            font-size: 16px;
            margin-bottom: 15px;
            color: #00d4ff;
        }

        .control-row {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .control-row label {
            flex: 1;
            font-size: 14px;
            color: #ccc;
        }

        .control-row input {
            width: 80px;
            padding: 5px;
            background: #444;
            border: 1px solid #555;
            border-radius: 4px;
            color: #fff;
            text-align: center;
        }

        .control-row input[type="range"] {
            width: 100px;
        }

        .results {
            background: #333;
            padding: 15px;
            border-radius: 8px;
        }

        .results h3 {
            font-size: 16px;
            margin-bottom: 15px;
            color: #00d4ff;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .result-value {
            color: #00ff88;
            font-weight: bold;
        }

        .canvas {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.1;
            pointer-events: none;
        }

        .path-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .point {
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: move;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            z-index: 10;
        }

        .start-point {
            background: #00ff88;
            color: #000;
        }

        .end-point {
            background: #ff4444;
            color: #fff;
        }

        .arrow {
            position: absolute;
            width: 30px;
            height: 2px;
            background: currentColor;
            transform-origin: left center;
            z-index: 5;
        }

        .arrow::after {
            content: '';
            position: absolute;
            right: -6px;
            top: -3px;
            width: 0;
            height: 0;
            border-left: 8px solid currentColor;
            border-top: 4px solid transparent;
            border-bottom: 4px solid transparent;
        }

        .start-arrow {
            color: #00ff88;
        }

        .end-arrow {
            color: #ff4444;
        }

        .instructions {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 8px;
            max-width: 250px;
        }

        .instructions h4 {
            color: #00d4ff;
            margin-bottom: 10px;
        }

        .instructions ul {
            list-style: none;
            font-size: 13px;
            line-height: 1.4;
        }

        .instructions li {
            margin-bottom: 5px;
            color: #ccc;
        }

        .instructions li::before {
            content: '→ ';
            color: #00d4ff;
        }
    </style>
</head>
<body>
    <div class="canvas-area">
        <div class="canvas" id="canvas">
            <!-- Grid -->
            <svg class="grid" id="grid"></svg>
            
            <!-- Path -->
            <svg class="path-svg" id="path-svg"></svg>
            
            <!-- Start point -->
            <div class="point start-point" id="start-point" style="left: 100px; top: 200px;">S</div>
            <div class="arrow start-arrow" id="start-arrow" style="left: 110px; top: 209px; transform: rotate(0deg);"></div>
            
            <!-- End point -->
            <div class="point end-point" id="end-point" style="left: 400px; top: 300px;">E</div>
            <div class="arrow end-arrow" id="end-arrow" style="left: 410px; top: 309px; transform: rotate(90deg);"></div>
        </div>

        <div class="instructions">
            <h4>Controls</h4>
            <ul>
                <li>Drag points to move them</li>
                <li>Adjust parameters in panel</li>
                <li>Watch path update in real-time</li>
            </ul>
        </div>
    </div>

    <div class="controls">
        <div class="header">
            <h1>Dubins Path Demo</h1>
            <p>Interactive path planning visualization</p>
        </div>

        <div class="control-group">
            <h3>Start Point</h3>
            <div class="control-row">
                <label>X:</label>
                <input type="number" id="start-x" value="2" step="0.5">
            </div>
            <div class="control-row">
                <label>Y:</label>
                <input type="number" id="start-y" value="4" step="0.5">
            </div>
            <div class="control-row">
                <label>Angle:</label>
                <input type="range" id="start-angle" min="0" max="360" value="0">
                <span id="start-angle-value">0°</span>
            </div>
        </div>

        <div class="control-group">
            <h3>End Point</h3>
            <div class="control-row">
                <label>X:</label>
                <input type="number" id="end-x" value="8" step="0.5">
            </div>
            <div class="control-row">
                <label>Y:</label>
                <input type="number" id="end-y" value="6" step="0.5">
            </div>
            <div class="control-row">
                <label>Angle:</label>
                <input type="range" id="end-angle" min="0" max="360" value="90">
                <span id="end-angle-value">90°</span>
            </div>
        </div>

        <div class="control-group">
            <h3>Parameters</h3>
            <div class="control-row">
                <label>Turning Radius:</label>
                <input type="range" id="turning-radius" min="0.5" max="5" step="0.1" value="2">
                <span id="radius-value">2.0</span>
            </div>
        </div>

        <div class="results">
            <h3>Path Analysis</h3>
            <div class="result-item">
                <span>Length:</span>
                <span class="result-value" id="path-length">-</span>
            </div>
            <div class="result-item">
                <span>Type:</span>
                <span class="result-value" id="path-type">-</span>
            </div>
            <div class="result-item">
                <span>Status:</span>
                <span class="result-value" id="path-status">Ready</span>
            </div>
        </div>
    </div>

    <script>
        let isDragging = false;
        let dragElement = null;
        let dragOffset = { x: 0, y: 0 };
        const scale = 50; // pixels per unit

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            setupCanvas();
            setupControls();
            setupDragAndDrop();
            calculatePath();
        });

        function setupCanvas() {
            const canvas = document.getElementById('canvas');
            const rect = canvas.getBoundingClientRect();
            
            // Create grid
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            
            for (let x = 0; x <= rect.width; x += scale) {
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', x);
                line.setAttribute('y1', 0);
                line.setAttribute('x2', x);
                line.setAttribute('y2', rect.height);
                line.setAttribute('stroke', '#333');
                line.setAttribute('stroke-width', '1');
                grid.appendChild(line);
            }
            
            for (let y = 0; y <= rect.height; y += scale) {
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', 0);
                line.setAttribute('y1', y);
                line.setAttribute('x2', rect.width);
                line.setAttribute('y2', y);
                line.setAttribute('stroke', '#333');
                line.setAttribute('stroke-width', '1');
                grid.appendChild(line);
            }
        }

        function setupControls() {
            // Start point controls
            document.getElementById('start-x').addEventListener('input', updateFromControls);
            document.getElementById('start-y').addEventListener('input', updateFromControls);
            document.getElementById('start-angle').addEventListener('input', function() {
                document.getElementById('start-angle-value').textContent = this.value + '°';
                updateFromControls();
            });

            // End point controls
            document.getElementById('end-x').addEventListener('input', updateFromControls);
            document.getElementById('end-y').addEventListener('input', updateFromControls);
            document.getElementById('end-angle').addEventListener('input', function() {
                document.getElementById('end-angle-value').textContent = this.value + '°';
                updateFromControls();
            });

            // Parameters
            document.getElementById('turning-radius').addEventListener('input', function() {
                document.getElementById('radius-value').textContent = parseFloat(this.value).toFixed(1);
                updateFromControls();
            });
        }

        function setupDragAndDrop() {
            const points = document.querySelectorAll('.point');
            
            points.forEach(point => {
                point.addEventListener('mousedown', startDrag);
            });

            document.addEventListener('mousemove', drag);
            document.addEventListener('mouseup', stopDrag);
        }

        function startDrag(e) {
            e.preventDefault();
            isDragging = true;
            dragElement = e.target;
            
            const rect = dragElement.getBoundingClientRect();
            const canvasRect = document.getElementById('canvas').getBoundingClientRect();
            
            dragOffset.x = e.clientX - rect.left - rect.width/2;
            dragOffset.y = e.clientY - rect.top - rect.height/2;
        }

        function drag(e) {
            if (!isDragging || !dragElement) return;
            
            const canvasRect = document.getElementById('canvas').getBoundingClientRect();
            
            let x = e.clientX - canvasRect.left - dragOffset.x - 10;
            let y = e.clientY - canvasRect.top - dragOffset.y - 10;
            
            // Snap to grid
            x = Math.round(x / scale) * scale;
            y = Math.round(y / scale) * scale;
            
            // Keep within bounds
            x = Math.max(0, Math.min(canvasRect.width - 20, x));
            y = Math.max(0, Math.min(canvasRect.height - 20, y));
            
            dragElement.style.left = x + 'px';
            dragElement.style.top = y + 'px';
            
            // Update arrow position
            const arrowId = dragElement.id.replace('-point', '-arrow');
            const arrow = document.getElementById(arrowId);
            arrow.style.left = (x + 10) + 'px';
            arrow.style.top = (y + 9) + 'px';
            
            updateControlsFromPoints();
            calculatePath();
        }

        function stopDrag() {
            isDragging = false;
            dragElement = null;
        }

        function updateFromControls() {
            const startX = parseFloat(document.getElementById('start-x').value);
            const startY = parseFloat(document.getElementById('start-y').value);
            const startAngle = parseFloat(document.getElementById('start-angle').value);
            
            const endX = parseFloat(document.getElementById('end-x').value);
            const endY = parseFloat(document.getElementById('end-y').value);
            const endAngle = parseFloat(document.getElementById('end-angle').value);
            
            // Update point positions
            const startPoint = document.getElementById('start-point');
            const endPoint = document.getElementById('end-point');
            const startArrow = document.getElementById('start-arrow');
            const endArrow = document.getElementById('end-arrow');
            
            startPoint.style.left = (startX * scale - 10) + 'px';
            startPoint.style.top = (startY * scale - 10) + 'px';
            startArrow.style.left = (startX * scale) + 'px';
            startArrow.style.top = (startY * scale - 1) + 'px';
            startArrow.style.transform = `rotate(${startAngle}deg)`;
            
            endPoint.style.left = (endX * scale - 10) + 'px';
            endPoint.style.top = (endY * scale - 10) + 'px';
            endArrow.style.left = (endX * scale) + 'px';
            endArrow.style.top = (endY * scale - 1) + 'px';
            endArrow.style.transform = `rotate(${endAngle}deg)`;
            
            calculatePath();
        }

        function updateControlsFromPoints() {
            const startPoint = document.getElementById('start-point');
            const endPoint = document.getElementById('end-point');
            
            const startX = (parseInt(startPoint.style.left) + 10) / scale;
            const startY = (parseInt(startPoint.style.top) + 10) / scale;
            const endX = (parseInt(endPoint.style.left) + 10) / scale;
            const endY = (parseInt(endPoint.style.top) + 10) / scale;
            
            document.getElementById('start-x').value = startX.toFixed(1);
            document.getElementById('start-y').value = startY.toFixed(1);
            document.getElementById('end-x').value = endX.toFixed(1);
            document.getElementById('end-y').value = endY.toFixed(1);
        }

        async function calculatePath() {
            const startX = parseFloat(document.getElementById('start-x').value);
            const startY = parseFloat(document.getElementById('start-y').value);
            const startAngle = parseFloat(document.getElementById('start-angle').value);
            
            const endX = parseFloat(document.getElementById('end-x').value);
            const endY = parseFloat(document.getElementById('end-y').value);
            const endAngle = parseFloat(document.getElementById('end-angle').value);
            
            const turningRadius = parseFloat(document.getElementById('turning-radius').value);
            
            document.getElementById('path-status').textContent = 'Calculating...';
            
            try {
                const response = await fetch('/api/calculate_path', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        start_position: [startX, startY],
                        end_position: [endX, endY],
                        start_angle: startAngle,
                        end_angle: endAngle,
                        turning_radius: turningRadius
                    })
                });

                const result = await response.json();
                
                if (result.success) {
                    drawPath(result.path_points);
                    document.getElementById('path-length').textContent = result.path_length.toFixed(2) + ' units';
                    document.getElementById('path-type').textContent = result.path_type;
                    document.getElementById('path-status').textContent = 'Success';
                } else {
                    clearPath();
                    document.getElementById('path-length').textContent = '-';
                    document.getElementById('path-type').textContent = result.path_type || 'Error';
                    document.getElementById('path-status').textContent = 'Failed';
                }
            } catch (error) {
                console.error('Error:', error);
                clearPath();
                document.getElementById('path-status').textContent = 'Error';
            }
        }

        function drawPath(pathPoints) {
            const svg = document.getElementById('path-svg');
            svg.innerHTML = '';
            
            if (pathPoints.length < 2) return;
            
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            
            let pathData = `M ${pathPoints[0][0] * scale} ${pathPoints[0][1] * scale}`;
            for (let i = 1; i < pathPoints.length; i++) {
                pathData += ` L ${pathPoints[i][0] * scale} ${pathPoints[i][1] * scale}`;
            }
            
            path.setAttribute('d', pathData);
            path.setAttribute('fill', 'none');
            path.setAttribute('stroke', '#00d4ff');
            path.setAttribute('stroke-width', '3');
            path.setAttribute('stroke-linecap', 'round');
            
            svg.appendChild(path);
        }

        function clearPath() {
            const svg = document.getElementById('path-svg');
            svg.innerHTML = '';
        }

        // Handle window resize
        window.addEventListener('resize', function() {
            setTimeout(setupCanvas, 100);
        });
    </script>
</body>
</html>
